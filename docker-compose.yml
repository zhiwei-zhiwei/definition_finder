services:
  backend:
    build: ./backend
    env_file: backend/.env
    ports: ["8000:8000"]
    volumes:
      # Same data/ as local dev; .env's ../data/... paths resolve to /app/data from /app/backend
      - ./data:/app/data
      # Docling / Hugging Face model downloads survive container rebuilds
      - model-cache:/root/.cache
    environment:
      # Telemetry is off unless set, e.g. OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318 with --profile obs
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API, so this is the host's address, not http://backend:8000
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
  # Traces + metrics UI: OTel Collector, Tempo, Prometheus and Grafana (http://localhost:3002)
  # in one container. Only with `docker compose --profile obs up`.
  lgtm:
    image: grafana/otel-lgtm:0.35.0
    profiles: [obs]
    ports: ["3002:3000", "4318:4318"]
    volumes:
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/lexisai.yaml:ro
      - ./observability/grafana/lexisai.json:/otel-lgtm/lexisai/lexisai.json:ro

volumes:
  model-cache:

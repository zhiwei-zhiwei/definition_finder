# kind cluster for local Kubernetes dev on the Mac (LX-1).
# Create: kind create cluster --config deploy/kind/cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lexisai                 # cluster name -> kubectl context "kind-lexisai"
nodes:
  - role: control-plane       # one node runs everything; enough for dev
    # Step 4's Ingress needs host ports 80/443 forwarded into the node container.
    # kind can only set these at creation, so they're here from the start.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
      - containerPort: 443
        hostPort: 443
# Mac kind cluster. Images are put on the node with `kind load docker-image`,
# so never try to pull them: a missing image fails fast with ErrImageNeverPull
# instead of a confusing ErrImagePull from a registry that doesn't have it.
backend:
  image:
    pullPolicy: Never
  # Docker Desktop gives kind ~3.8 GiB; a 4Gi limit would never be reached before the whole VM
  # runs out. 2.5Gi keeps the cap real: big PDFs (AMD 10-K, the lease) fail with a clean
  # OOMKilled on this container only. Raise it together with Docker Desktop's memory.
  resources:
    limits:
      memory: 2560Mi
frontend:
  image:
    pullPolicy: Never

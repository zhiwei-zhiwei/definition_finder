name: CI

# Every push on any branch; a PR shows the checks of its head commit, so no pull_request trigger
on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the old commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17" # same uv as local and backend/Dockerfile
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Exact versions from uv.lock; --locked fails if pyproject.toml changed without re-locking
      - run: uv sync --locked --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: ruff
        run: ruff check app scripts tests
      - name: pytest
        run: pytest -q
      # Offline retrieval gate: replays the frozen AMD 10-K fixture, exits 1 below the floors in eval_smoke.py
      - name: retrieval gate
        run: python scripts/eval_smoke.py

  k8s-smoke:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30 # pitfall 6: never hang until GitHub's 6 h cap
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # load: true puts the image into the runner's Docker so `kind load` can find it (pitfall 2).
      # The gha cache keeps rebuilds to a few seconds when only the chart changed.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: lexisai-backend:dev
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: lexisai-frontend:dev
          build-args: NEXT_PUBLIC_API_BASE= # empty = relative URLs through the Ingress (pitfall 7)
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Same cluster config as on the Mac (deploy/kind/cluster.yaml), so the runner's port 80
      # reaches Traefik exactly like localhost:80 does locally
      - uses: helm/kind-action@v1.15.1
        with:
          config: deploy/kind/cluster.yaml
          cluster_name: lexisai

      - name: Load images into kind
        run: kind load docker-image lexisai-backend:dev lexisai-frontend:dev --name lexisai

      - name: Install Traefik
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm install traefik traefik/traefik --version 42.1.3 -n traefik --create-namespace \
            -f deploy/kind/traefik-values.yaml --wait

      # Empty OPENAI_API_KEY on branches and fork PRs (no secret there); only main's query step needs it
      - name: Create the app Secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          kubectl create secret generic lexisai-secrets \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=JWT_SECRET="$(openssl rand -hex 32)"

      - name: Lint and install the chart
        run: |
          helm lint deploy/helm/lexisai -f deploy/helm/lexisai/values-kind.yaml
          # --wait: return only once every Pod passes its readinessProbe (pitfall 3)
          helm install lexisai deploy/helm/lexisai -f deploy/helm/lexisai/values-kind.yaml \
            --wait --timeout 5m

      - name: "Smoke: health and frontend through the Ingress"
        run: |
          # -f: exit non-zero on HTTP 4xx/5xx, which fails the step
          # -sS: quiet, but still print the error if something goes wrong
          # --max-time 30: give up after 30 s instead of hanging (pitfall 6)
          curl -fsS --max-time 30 http://localhost/health          # backend through the Ingress; prints {"ok":true}
          curl -fsS --max-time 30 -o /dev/null http://localhost/   # frontend; only the status matters, drop the body

      - name: "Smoke: upload a document"
        run: |
          printf '<h1>Lease</h1><p>The monthly rent is $2,500, due on the 1st of each month.</p>' > lease.html
          # DOC_ID goes into $GITHUB_ENV so later steps can read it as $DOC_ID
          echo "DOC_ID=$(curl -fsS --max-time 30 -F file=@lease.html http://localhost/documents \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')" >> "$GITHUB_ENV"

      # Costs a fraction of a cent (one tiny embed + one short answer), so main only
      - name: "Smoke: one query (main only)"
        if: github.ref == 'refs/heads/main'
        run: |
          curl -sN --max-time 180 -X POST http://localhost/query \
            -H 'Content-Type: application/json' \
            -d "{\"doc_id\":\"$DOC_ID\",\"query\":\"What is the rent?\"}" > stream.txt
          grep -c '^event: token' stream.txt      # how many tokens streamed (shows in the log)
          grep -q '^event: done' stream.txt       # the stream must reach the end; no match → exit 1 → step fails
          # and must not contain an error event. Not `! grep -q ...`: bash's `set -e` ignores a
          # negated command, so that line only fails the step while it happens to be the last one
          if grep -q '^event: error' stream.txt; then cat stream.txt; exit 1; fi

      # Only on failure: leave enough in the log to debug a runner that's already gone (pitfall 4)
      - name: Dump cluster state
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods -l 'app in (lexisai-backend,lexisai-frontend)'
          kubectl logs deploy/lexisai-backend --tail=200 || true
          kubectl logs deploy/lexisai-frontend --tail=50 || true
          kubectl -n traefik logs deploy/traefik --tail=50 || true
